<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#5AA0FF" />
      <stop offset="100%" stop-color="#1A6DFF" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#E8912E" />
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#102A4A" />
      <stop offset="100%" stop-color="#081838" />
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="url(#ring)" />
  
  <!-- Dark body -->
  <circle cx="50" cy="50" r="40" fill="url(#dark)" />

  <!-- Aperture blades - 8 segments -->
  <path d="M50,8 A42,42 0 0,1 79.7,20.3 L50,50 Z" fill="url(#amber)" opacity="0.9" />
  <path d="M79.7,20.3 A42,42 0 0,1 92,50 L50,50 Z" fill="white" opacity="0.2" />
  <path d="M92,50 A42,42 0 0,1 79.7,79.7 L50,50 Z" fill="white" opacity="0.15" />
  <path d="M79.7,79.7 A42,42 0 0,1 50,92 L50,50 Z" fill="white" opacity="0.2" />
  <path d="M50,92 A42,42 0 0,1 20.3,79.7 L50,50 Z" fill="white" opacity="0.15" />
  <path d="M20.3,79.7 A42,42 0 0,1 8,50 L50,50 Z" fill="white" opacity="0.2" />
  <path d="M8,50 A42,42 0 0,1 20.3,20.3 L50,50 Z" fill="white" opacity="0.15" />
  <path d="M20.3,20.3 A42,42 0 0,1 50,8 L50,50 Z" fill="white" opacity="0.2" />

  <!-- Globe latitude lines -->
  <ellipse cx="50" cy="50" rx="22" ry="32" fill="none" stroke="white" stroke-width="0.8" opacity="0.35" />
  <line x1="28" y1="50" x2="72" y2="50" stroke="white" stroke-width="0.8" opacity="0.35" />
  <line x1="31" y1="38" x2="69" y2="38" stroke="white" stroke-width="0.6" opacity="0.15" />
  <line x1="31" y1="62" x2="69" y2="62" stroke="white" stroke-width="0.6" opacity="0.15" />

  <!-- Center amber dot -->
  <circle cx="50" cy="50" r="4" fill="url(#amber)" />
  <circle cx="50" cy="50" r="2" fill="white" opacity="0.8" />
</svg>