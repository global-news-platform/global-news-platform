<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#1a1a35"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg)" width="1200" height="630"/>
  <!-- chart grid -->
  <line x1="200" y1="480" x2="1050" y2="480" stroke="#2a2a4a" stroke-width="1"/>
  <line x1="200" y1="420" x2="1050" y2="420" stroke="#2a2a4a" stroke-width="0.5"/>
