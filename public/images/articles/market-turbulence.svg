  <rect x="740" y="290" width="20" height="190" fill="#e74c3c" opacity="0.7"/>
  <rect x="810" y="320" width="20" height="160" fill="#2ecc71" opacity="0.7"/>
  <rect x="880" y="250" width="20" height="230" fill="#e74c3c" opacity="0.7"/>
  <!-- trend line -->
  <polyline points="260,440 330,410 400,420 470,370 540,350 610,380 680,400 750,340 820,370 890,310" fill="none" stroke="#f1c40f" stroke-width="2.5"/>
  <text x="80" y="200" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff">Emergency Rate</text>
  <text x="80" y="258" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff">Decision</text>
  <rect x="80" y="285" width="60" height="4" fill="#f1c40f"/>
  <text x="80" y="325" font-family="Arial, sans-serif" font-size="20" fill="#7788aa">Business · 2025</text>
