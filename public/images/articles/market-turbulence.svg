  <line x1="200" y1="300" x2="1050" y2="300" stroke="#2a2a4a" stroke-width="0.5"/>
  <line x1="200" y1="240" x2="1050" y2="240" stroke="#2a2a4a" stroke-width="0.5"/>
  <line x1="200" y1="180" x2="1050" y2="180" stroke="#2a2a4a" stroke-width="0.5"/>
  <!-- candlestick chart -->
  <rect x="250" y="400" width="20" height="80" fill="#2ecc71" opacity="0.7"/>
  <rect x="320" y="350" width="20" height="130" fill="#e74c3c" opacity="0.7"/>
  <rect x="390" y="370" width="20" height="110" fill="#2ecc71" opacity="0.7"/>
  <rect x="460" y="300" width="20" height="180" fill="#e74c3c" opacity="0.7"/>
