<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0a0a2e"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg)" width="1200" height="630"/>
  <!-- stars -->
  <circle cx="100" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="50" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="500" cy="100" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="700" cy="40" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="900" cy="90" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="1100" cy="60" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="150" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="450" cy="140" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="650" cy="120" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="850" cy="160" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="1050" cy="130" r="1" fill="#ffffff" opacity="0.6"/>
  <!-- nebula -->
  <ellipse cx="750" cy="300" rx="250" ry="150" fill="#6c3483" opacity="0.15"/>
  <ellipse cx="750" cy="300" rx="150" ry="80" fill="#8e44ad" opacity="0.1"/>
  <!-- telescope silhouette -->
  <rect x="350" y="200" width="200" height="60" rx="5" fill="#2c3e50" opacity="0.8"/>
  <rect x="370" y="260" width="160" height="15" fill="#34495e" opacity="0.6"/>
  <rect x="400" y="275" width="100" height="120" fill="#2c3e50" opacity="0.5"/>
  <polygon points="350,200 400,140 500,140 550,200" fill="#2c3e50" opacity="0.7"/>
  <rect x="420" y="160" width="60" height="40" fill="#1a252f" opacity="0.6"/>
  <circle cx="450" cy="180" r="8" fill="#3498db" opacity="0.5"/>
  <text x="80" y="420" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff">Space Telescope</text>
  <text x="80" y="478" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff">Images</text>
  <rect x="80" y="505" width="60" height="4" fill="#9b59b6"/>
