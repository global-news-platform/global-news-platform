<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(26,10,46)"/>
      <stop offset="50%" stop-color="rgb(41,20,66)"/>
      <stop offset="100%" stop-color="rgb(26,10,46)"/>
    </linearGradient>
    <radialGradient id="spot1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgb(139,92,246)" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="rgb(139,92,246)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgb(100,50,180)" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="rgb(100,50,180)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgb(0,0,0)" stop-opacity="0"/>
      <stop offset="60%" stop-color="rgb(0,0,0)" stop-opacity="0"/>
      <stop offset="100%" stop-color="rgb(0,0,0)" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none" stroke="rgb(255,255,255)" stroke-opacity="0.02"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#spot1)"/>
  <rect width="1200" height="800" fill="url(#spot2)"/>
  <rect x="0" y="0" width="1200" height="4" fill="rgb(139,92,246)" opacity="0.5"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#vignette)"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="rgb(255,255,255)" stroke-opacity="0.04" stroke-width="1"/>
  <rect x="60" y="590" width="40" height="4" fill="rgb(139,92,246)" opacity="0.6"/>
  <text x="60" y="660" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="white" opacity="0.9">TECHNOLOGY</text>
  <text x="60" y="700" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.25">Global News Pakistan</text>
  <rect x="60" y="740" width="1080" height="1" fill="rgb(139,92,246)" opacity="0.15"/>
