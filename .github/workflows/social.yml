name: Social Media Posting

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (preview only)"
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: social-posting
  cancel-in-progress: false

jobs:
  facebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Fetch Facebook logo
        run: node scripts/fetch-logo.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Post top articles to Facebook Page
        run: |
          node scripts/post-social.js \
            --page-id="${{ secrets.FB_PAGE_ID }}" \
            --token="${{ secrets.FB_PAGE_ACCESS_TOKEN }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_URL: "https://thegloballens365.vercel.app"
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_REWRITE_MODEL: ${{ secrets.AI_REWRITE_MODEL || 'gpt-4o-mini' }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.openai.com/v1' }}

      - name: Commit tracker
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "opencloud-ai[bot]"
          git config user.email "148978119+opencloud-ai[bot]@users.noreply.github.com"
          git add src/data/.facebook-tracker.json
          git diff --staged --quiet || git commit -m "Auto: update facebook tracker"
          git pull --rebase origin main
          git push

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Social posting failed on $(date)"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
