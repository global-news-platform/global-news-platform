name: Social Media Posting

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (preview only)"
        default: "false"
        type: choice
        options:
          - "true"
          - "false"


permissions:
  contents: write

jobs:
  facebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Fetch Facebook logo
        run: node scripts/fetch-logo.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Post top articles to Facebook Page
        run: |
          node scripts/post-social.js \
            --page-id="${{ secrets.FB_PAGE_ID }}" \
            --token="${{ secrets.FB_PAGE_ACCESS_TOKEN }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_URL: https://thegloballens365.vercel.app
          AI_IMAGE_ENABLED: ${{ secrets.AI_IMAGE_API_KEY != '' && 'true' || 'false' }}
          AI_IMAGE_API_KEY: ${{ secrets.AI_IMAGE_API_KEY }}
          AI_IMAGE_MODEL: ${{ secrets.AI_IMAGE_MODEL || 'flux' }}

      - name: Commit tracker
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "opencloud-ai[bot]"
          git config user.email "148978119+opencloud-ai[bot]@users.noreply.github.com"
          git add src/data/.facebook-tracker.json
          git diff --staged --quiet || git commit -m "Auto: update facebook tracker"
          git pull --rebase origin main
          git push
