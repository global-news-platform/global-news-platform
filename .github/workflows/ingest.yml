name: Maintenance

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Regenerate sitemap & RSS feed
        run: |
          node scripts/lib/sitemap.js
          node scripts/lib/feed.js

      - name: Compute metrics & trending
        run: node -e "
          const { computeTrending, computeDailyMetrics } = require('./scripts/lib/metrics');
          computeTrending(20);
          computeDailyMetrics();
          console.log('✓ Metrics & trending updated');
        "

      - name: Commit & push
        run: |
          git config user.name "The Global Lens 365 Bot"
          git config user.email "bot@thegloballens365.vercel.app"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: maintenance $(date +%Y-%m-%d-%H)"
            git push
          fi
