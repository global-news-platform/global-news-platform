name: Delete Facebook Posts

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Delete posts from the last N days"
        default: "3"
        type: number
      dry_run:
        description: "Dry run (list posts only, no deletion)"
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Delete recent Facebook posts
        run: |
          node scripts/delete-facebook-posts.js \
            --days="${{ github.event.inputs.days }}" \
            --page-id="${{ secrets.FB_PAGE_ID }}" \
            --token="${{ secrets.FB_PAGE_ACCESS_TOKEN }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
