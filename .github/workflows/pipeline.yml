name: News Pipeline

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Max articles per source"
        required: false
        default: "10"
      concurrency:
        description: "Concurrent fetches"
        required: false
        default: "5"
      post_to_facebook:
        description: "Post to Facebook after ingest"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ingestion
        run: |
          node scripts/pipeline.js --max=${{ github.event.inputs.max_articles || '10' }} ${{ github.event.inputs.post_to_facebook == 'true' && '--facebook' || '' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_URL: "https://thegloballens365.vercel.app"
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_REWRITE_ENABLED: ${{ secrets.AI_API_KEY != '' && 'true' || 'false' }}
          AI_REWRITE_MODEL: ${{ secrets.AI_REWRITE_MODEL || 'gpt-4o-mini' }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.openai.com/v1' }}
          AI_IMAGE_ENABLED: ${{ secrets.AI_IMAGE_API_KEY != '' && 'true' || 'false' }}
          AI_IMAGE_API_KEY: ${{ secrets.AI_IMAGE_API_KEY }}
          AI_IMAGE_MODEL: ${{ secrets.AI_IMAGE_MODEL || 'black-forest-labs/flux-schnell' }}

      - name: Fetch Facebook logo
        run: node scripts/fetch-logo.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Generate sitemap & feed
        run: |
          node scripts/lib/sitemap.js
          node scripts/lib/feed.js

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "The Global Lens 365 Bot"
          git config user.email "bot@thegloballens365.vercel.app"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: pipeline ingest $(date +%Y-%m-%d-%H)"
            git push
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel --prod --token="$VERCEL_TOKEN" --yes
