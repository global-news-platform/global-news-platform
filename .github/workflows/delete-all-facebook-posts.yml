name: Delete All Facebook Posts
on: workflow_dispatch
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/delete-facebook-posts.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      - name: Commit tracker reset
        run: |
          git config user.name "opencloud-ai[bot]"
          git config user.email "148978119+opencloud-ai[bot]@users.noreply.github.com"
          git add src/data/.facebook-tracker.json
          git diff --staged --quiet || git commit -m "Auto: reset facebook tracker after purge"
          git push
