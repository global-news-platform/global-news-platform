name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Fetch Facebook logo
        run: node scripts/fetch-logo.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          TEAM="x-vercel-team-id: $VERCEL_ORG_ID"

          # Create project if missing
          curl -sf -X POST "$API/v1/projects" \
            -H "$AUTH" -H "$TEAM" \
            -H "Content-Type: application/json" \
            -d '{"name":"thegloballens365","framework":"nextjs",
                 "buildCommand":"npm run build","outputDirectory":".next",
                 "installCommand":"npm ci"}' > /dev/null || true

          # Ensure correct Next.js settings
          curl -sf -X PATCH "$API/v1/projects/thegloballens365" \
            -H "$AUTH" -H "$TEAM" \
            -H "Content-Type: application/json" \
            -d '{"framework":"nextjs","buildCommand":"npm run build",
                 "outputDirectory":".next","installCommand":"npm ci"}' > /dev/null || true

          # Deploy source (Vercel builds on their servers)
          npx vercel deploy --prod --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" --yes \
            --project=thegloballens365 2>&1
