name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Fetch Facebook logo
        run: node scripts/fetch-logo.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: |
          npx vercel --prod --token "${{ secrets.VERCEL_TOKEN }}" \
            --scope "${{ secrets.VERCEL_ORG_ID }}" \
            --confirm 2>&1

      - name: Report success
        if: success()
        run: |
          echo "✅ Deployed successfully: https://thegloballens365.vercel.app"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Deploy failed! Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
