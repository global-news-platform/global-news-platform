name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Fetch Facebook logo
        run: node scripts/fetch-logo.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Build
        run: npm run build

      - name: Create Vercel project & deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          # Create project with GitHub integration (idempotent)
          curl -sf -X POST "https://api.vercel.com/v1/projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "x-vercel-team-id: $VERCEL_ORG_ID" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "TheGlobalLens365",
              "framework": "nextjs",
              "gitRepository": {
                "type": "github",
                "repoId": 1235422354
              }
            }' 2>&1 | head -3 || echo "Project may already exist"

          # Deploy from GitHub
          curl -sf -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "x-vercel-team-id: $VERCEL_ORG_ID" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "TheGlobalLens365",
              "project": "TheGlobalLens365",
              "gitSource": {
                "type": "github",
                "ref": "main",
                "repoId": 1235422354
              },
              "target": "production"
            }' 2>&1 | head -5
