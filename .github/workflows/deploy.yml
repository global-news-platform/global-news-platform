name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Fetch Facebook logo
        run: node scripts/fetch-logo.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Build
        run: npm run build

      - name: Check Vercel setup
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          {
            echo "## Vercel Debug"
            echo ""
            echo "**Token length:** ${#VERCEL_TOKEN}"
            echo "**Org ID:** ${VERCEL_ORG_ID}"
            echo ""
            echo "### User info"
            curl -sS "https://api.vercel.com/v2/user" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | head -5
            echo ""
            echo "### Teams"
            curl -sS "https://api.vercel.com/v2/teams" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | head -10
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create project & deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          # Create project
          PROJ=$(curl -sS -X POST "https://api.vercel.com/v1/projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "x-vercel-team-id: $VERCEL_ORG_ID" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "TheGlobalLens365",
              "framework": "nextjs",
              "buildCommand": "npm run build",
              "outputDirectory": ".next",
              "installCommand": "npm ci",
              "gitRepository": {"type": "github", "repoId": 1235422354}
            }' 2>&1)
          echo "--- Project create exit: $? ---"

          # Create deployment
          DEP=$(curl -sS -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "x-vercel-team-id: $VERCEL_ORG_ID" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "TheGlobalLens365",
              "project": "TheGlobalLens365",
              "gitSource": {"type": "github", "ref": "main", "repoId": 1235422354},
              "target": "production"
            }' 2>&1)
          echo "--- Deploy create exit: $? ---"

          # Extract URL and ID
          URL=$(echo "$DEP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url','no-url'))" 2>/dev/null || echo "parse-failed")
          ID=$(echo "$DEP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id','no-id'))" 2>/dev/null || echo "parse-failed")
          echo "URL=$URL ID=$ID"

          # Wait for build, poll every 30s up to 10min
          if [ "$ID" != "no-id" ]; then
            for i in $(seq 1 20); do
              sleep 30
              STATUS=$(curl -sS "https://api.vercel.com/v13/deployments/$ID" \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "x-vercel-team-id: $VERCEL_ORG_ID" 2>/dev/null | \
                python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('readyState','unknown'))" 2>/dev/null || echo "unknown")
              echo "  Check $i: $STATUS"
              if [ "$STATUS" = "READY" ] || [ "$STATUS" = "ERROR" ]; then break; fi
            done
          fi