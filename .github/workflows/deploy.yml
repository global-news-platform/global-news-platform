name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Fetch Facebook logo
        run: node scripts/fetch-logo.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Build
        run: npm run build

      - name: Check Vercel setup
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          {
            echo "## Vercel Debug"
            echo ""
            echo "**Token length:** ${#VERCEL_TOKEN}"
            echo "**Org ID:** ${VERCEL_ORG_ID}"
            echo ""
            echo "### User info"
            curl -sS "https://api.vercel.com/v2/user" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | head -5
            echo ""
            echo "### Teams"
            curl -sS "https://api.vercel.com/v2/teams" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | head -10
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create project & deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -e
          API_BASE="https://api.vercel.com"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          TEAM="x-vercel-team-id: $VERCEL_ORG_ID"

          # Create project (idempotent)
          curl -sS -X POST "$API_BASE/v1/projects" \
            -H "$AUTH" -H "$TEAM" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "TheGlobalLens365",
              "framework": "nextjs",
              "buildCommand": "npm run build",
              "outputDirectory": ".next",
              "installCommand": "npm ci",
              "gitRepository": {"type": "github", "repoId": 1235422354}
            }' 2>&1 | head -5 || echo "Project exists"

          # Create deployment
          DEP=$(curl -sS -X POST "$API_BASE/v13/deployments" \
            -H "$AUTH" -H "$TEAM" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "TheGlobalLens365",
              "project": "TheGlobalLens365",
              "gitSource": {"type": "github", "ref": "main", "repoId": 1235422354},
              "target": "production"
            }' 2>&1)

          DEP_URL=$(echo "$DEP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url','N/A'))" 2>/dev/null || echo "parse-error")
          DEP_ID=$(echo "$DEP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id','N/A'))" 2>/dev/null || echo "parse-error")
          echo "Deployment URL: $DEP_URL"
          echo "Deployment ID: $DEP_ID"

          if [ "$DEP_ID" = "N/A" ] || [ "$DEP_ID" = "parse-error" ]; then
            echo "ERROR: Could not parse deployment response"
            echo "$DEP" | head -20
            exit 1
          fi

          # Poll for build completion (up to 10 min)
          for i in $(seq 1 20); do
            sleep 30
            INFO=$(curl -sS "$API_BASE/v13/deployments/$DEP_ID" -H "$AUTH" -H "$TEAM" 2>&1)
            STATE=$(echo "$INFO" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('readyState','unknown'))" 2>/dev/null || echo "unknown")
            echo "  Poll $i: $STATE"
            case "$STATE" in
              READY) echo "DEPLOYMENT READY: $DEP_URL"; exit 0 ;;
              ERROR)
                echo "BUILD FAILED. Error info:"
                echo "$INFO" | python3 -c "
import sys,json
d=json.load(sys.stdin)
e=d.get('error',{})
if e: print('Error:', json.dumps(e,indent=2))
for a in d.get('alias',[]): print('Alias:', a)
" 2>/dev/null
                exit 1
                ;;
              CANCELED) echo "Build cancelled"; exit 1 ;;
            esac
          done
          echo "TIMEOUT waiting for build"
          exit 1