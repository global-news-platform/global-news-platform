name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Delete old Vercel projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in thegloballens365 the-global-lens-365 tgl365 TGL365; do
            npx vercel project remove "$name" \
              --token="$VERCEL_TOKEN" \
              --scope=${{ secrets.VERCEL_ORG_ID }} \
              -y 2>&1 || true
          done

      - name: Create new Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel project add thegloballens365 \
            --token="$VERCEL_TOKEN" \
            --scope=${{ secrets.VERCEL_ORG_ID }} 2>&1 || echo "Project may already exist"

      - name: Fetch Facebook logo
        run: node scripts/fetch-logo.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Vercel Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel build --prod --token="$VERCEL_TOKEN" \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --project=thegloballens365

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --scope=${{ secrets.VERCEL_ORG_ID }} --yes
